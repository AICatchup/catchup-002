name: 資料・活用事例を投稿する
description: URL、PDF・PPTX、短いメモから。発表していない人も歓迎です
title: "[共有] "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        URL、ファイル、短いメモから共有できます。[参加者ガイド](https://github.com/AICatchup/catchup-002/blob/main/PARTICIPATE.md) / [AI向けの入口](https://github.com/AICatchup/catchup-002/blob/main/AGENTS.md)

        Issueは送信時から公開されます。添付ファイルは添付操作の時点でアップロードされるので、公開してよい内容だけを選んでください。送信後は運営が確認し、作者と原典を残して一覧への掲載を進めます。投稿は任意です。
  - type: input
    id: author
    attributes:
      label: 公開する作者名
      description: ハンドルネームで構いません。紹介の場合は元の作者を記入してください。
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 内容の種類
      description: 一番近いものを選んでください。迷ったら「その他・新しいカテゴリ」で構いません。
      options:
        - リンク・参考資料
        - 発表・LT
        - 活用事例
        - 作品・デモ
        - 試した記録
        - 質問・まだ分からないこと
        - その他・新しいカテゴリ
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 何をしたか・伝えたいこと
      description: 短いメモでも大丈夫です。資料がなければ、ここに本文を書けます。
      placeholder: 例：会議メモをAIで整理するとき、未決事項だけを先に抜き出すと次の作業を決めやすかった。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 資料のURL・ファイル添付
      description: 公開URLを貼るか、この欄へPDF・PPTXをドラッグ／添付できます（1ファイル25MBまで）。ファイルのリンクが表示されるまで待ってください。資料なしでも送れます。
      placeholder: 元資料・コード・デモ・作者の公開URL。利用条件がある場合はそのリンクも。
  - type: textarea
    id: evidence
    attributes:
      label: 試した日・環境・結果・未確認のこと
      description: 分かる範囲で構いません。まだ試していない内容は、その旨を書いてください。
  - type: checkboxes
    id: publication
    attributes:
      label: 公開の確認
      options:
        - label: 公開する権利のある内容を投稿し、作者・原典を示してこの公開アーカイブへ掲載・紹介されることに同意します。個人情報や秘密を含めていません。
          required: true
